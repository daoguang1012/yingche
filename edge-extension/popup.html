<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>映澈 · 网页增强</title></head><body>
<header><div><h1>映澈</h1><span>0.4.1 · GPUPixel + Deep-Live-Cam</span></div><button id="connect">连接检测</button></header>
<p id="message" role="status">请先在播放器「换脸」页开启 Edge 连接。</p>
<div class="actions"><button id="enable" class="accent">启用当前视频</button><button id="stop">停止增强</button></div><p id="videoState" class="muted">只处理你主动启用的页面</p>
<div class="checks"><label><input type="checkbox" id="enabled">人像美颜</label><label><input type="checkbox" id="compare">左侧原画对比</label></div>
<div class="presets"><button data-preset="natural">自然</button><button data-preset="clear">通透</button><button data-preset="strong">明显</button></div>
<details><summary>美颜参数 · 宽范围</summary><div id="parameters"></div></details>
<section><h2>照片换脸</h2><label class="file-button">选择源照片<input id="sourceFile" type="file" accept="image/jpeg,image/png,image/webp,image/bmp"></label><span id="sourceName" class="muted">推荐单人清晰正面照</span>
<label class="block"><input type="checkbox" id="swapEnabled">启用换脸</label><label class="line">替换目标<select id="swapTarget"><option value="largest">最大人脸</option><option value="all">全部人脸</option><option value="0">从左第 1 张</option><option value="1">从左第 2 张</option><option value="2">从左第 3 张</option><option value="3">从左第 4 张</option></select></label>
<label class="line">融合强度<input id="swapStrength" type="number" min="0" max="100" value="100"></label><label class="line">边缘柔和<input id="swapFeather" type="number" min="0" max="100" value="35"></label><button id="clearSource">清除源照片</button></section>
<footer>关闭增强会恢复原播放器。遇到跨域视频，可在页面浮窗中使用兼容捕获。受保护视频暂不支持。</footer><script src="popup.js"></script></body></html>
